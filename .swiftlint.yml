# SwiftLint configuration for Anu.
#
# Philosophy: catch genuine issues and egregious complexity, but don't impose
# churny stylistic limits on idiomatic Swift (short loop/math identifiers,
# multi-line collection literals, long-but-cohesive view bodies). Thresholds are
# tuned so the current tree passes `swiftlint --strict`; tighten over time.

# Lint shipping code. Tests legitimately use force-tries, long fixtures, and
# throwaway identifiers; a separate relaxed pass can cover them later.
included:
  - Sources
  - AnuWidget
  - AnuShare

excluded:
  - Pods
  - build
  - .build
  - DerivedData
  - Scripts

disabled_rules:
  - trailing_comma          # trailing commas in multi-line literals are fine
  - statement_position      # `else`/`catch` placement is a team style choice
  - todo                    # tracked TODO/FIXME markers are intentional
  - static_over_final_class # `final class func` vs `static` is a style choice

opt_in_rules:
  - empty_string
  - toggle_bool
  - operator_usage_whitespace
  - closure_spacing
  # NOTE: `redundant_nil_coalescing` is deliberately NOT enabled — its autofix
  # strips `?? nil` even when it flattens a nested optional (e.g. TaskGroup
  # `next()` returning T??), which silently breaks compilation.

identifier_name:
  min_length:
    warning: 1            # i, x, a, b are idiomatic in math/loop code
  max_length:
    warning: 60
    error: 80

line_length:
  warning: 150          # advisory; long descriptive UI copy is common
  error: 1000           # only an absurdly long line is a hard failure
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 160
  error: 320

type_body_length:
  warning: 520
  error: 800

file_length:
  warning: 900
  error: 1500
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 25
  error: 40

function_parameter_count:
  warning: 9
  error: 11

large_tuple:
  warning: 4
  error: 5

reporter: "xcode"
