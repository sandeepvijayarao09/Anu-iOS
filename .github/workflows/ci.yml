name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint (errors fail the build; long-line warnings are advisory)
        run: swiftlint lint --reporter github-actions-logging

  build-test:
    name: Build & unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Prefer Xcode 27 (Anu's Apple-model tiers, searchInApp and long-running
      # intents need the iOS 27 SDK). Until the runner image has it, build
      # with the newest Xcode 26: that code is behind `#if compiler(>=6.4)`
      # and is simply left out of the build there.
      - name: Select Xcode (27 if installed, else newest 26)
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Using ${XCODE:?no Xcode 26 or 27 on this runner}"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The committed project references the (gitignored) 3.4 GB model as a
      # bundle resource. The generator includes model files only when present
      # on disk, so regenerating on a fresh checkout produces a model-free app
      # that still builds; tests run against the in-repo ScriptedModel.
      - name: Generate Xcode project (model-free variant)
        run: python3 generate_xcodeproj.py

      - name: Pick an available iOS simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              cands=[v['name'] for rt in d for v in d[rt] if v.get('isAvailable') and 'iPhone' in v['name']]; \
              print(sorted(cands)[-1] if cands else 'iPhone 16')")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Anu.xcodeproj -scheme Anu \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DD \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Grant EventKit/Contacts to the app so the REAL integration tests
      # (EventKitIntegrationTests) run instead of skipping. Best-effort: if any
      # step fails the tests are permission-gated and simply skip, so CI stays
      # green either way.
      - name: Grant simulator privacy for real integration tests
        continue-on-error: true
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.device }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.device }}" -b || true
          APP=$(find build/DD/Build/Products -maxdepth 2 -name 'Anu.app' -type d | head -1)
          [ -n "$APP" ] && xcrun simctl install booted "$APP" || true
          for svc in reminders calendar contacts; do
            xcrun simctl privacy booted grant $svc io.github.sandeepvijayarao09.anu || true
          done

      - name: Run unit tests (deterministic; opt-in env-gated tests auto-skip)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Anu.xcodeproj -scheme Anu \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DD \
            -skipPackagePluginValidation \
            -only-testing:AnuTests \
            -resultBundlePath build/ci.xcresult \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ci.xcresult
          retention-days: 7
          if-no-files-found: ignore
